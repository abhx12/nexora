name: smartsilk-server

services:
  postgres:
    image: postgres:17
    container_name: smartsilk-server-postgres
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${DB_NAME:-smartsilk_ledger_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartsilk_server_secure_password}
    volumes:
      - smartsilk_server_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-smartsilk_ledger_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - smartsilk-internal

  backend:
    image: ${SERVER_IMAGE:-ghcr.io/nithiishsd/nexora-backend:latest}
    container_name: smartsilk-server-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-smartsilk_ledger_db}
      DB_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-smartsilk_server_secure_password}
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-smartsilk_ledger_db}
      FLYWAY_USER: ${DB_USER:-postgres}
      FLYWAY_PASSWORD: ${DB_PASSWORD:-smartsilk_server_secure_password}
      JWT_SECRET: ${JWT_SECRET:-smartsilk-server-production-master-jwt-secret-key-32chars}
      BOOTSTRAP_OWNER_USERNAME: ${BOOTSTRAP_OWNER_USERNAME:-owner}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:-DevOwner#2026pass}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCKOUT: ${LOGIN_LOCKOUT:-15m}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      DOCUMENTS_DIR: ${DOCUMENTS_DIR:-/var/lib/nexora/documents}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      WHATSAPP_API_ENABLED: ${WHATSAPP_API_ENABLED:-false}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://graph.facebook.com/v19.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      GST_EINVOICE_ENABLED: ${GST_EINVOICE_ENABLED:-false}
      GST_API_BASE_URL: ${GST_API_BASE_URL:-https://api-sandbox.einvoice.nic.in}
      GST_CLIENT_ID: ${GST_CLIENT_ID:-}
      GST_CLIENT_SECRET: ${GST_CLIENT_SECRET:-}
      GST_AUTH_TOKEN: ${GST_AUTH_TOKEN:-}
      GSTIN: ${GSTIN:-}
      BANK_INTEGRATION_ENABLED: ${BANK_INTEGRATION_ENABLED:-false}
      BANK_API_BASE_URL: ${BANK_API_BASE_URL:-}
      BANK_CLIENT_ID: ${BANK_CLIENT_ID:-}
      BANK_CLIENT_SECRET: ${BANK_CLIENT_SECRET:-}
      AI_OCR_PROVIDER: ${AI_OCR_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGE_PUBLIC_KEY: ${AGE_PUBLIC_KEY:-}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      HEALTHCHECK_PING_URL: ${HEALTHCHECK_PING_URL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ports:
      - "${SERVER_PORT:-8088}:8080"
    volumes:
      - smartsilk_server_documents_data:/var/lib/nexora/documents
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - smartsilk-internal

volumes:
  smartsilk_server_postgres_data:
  smartsilk_server_documents_data:

networks:
  smartsilk-internal:
    driver: bridge
